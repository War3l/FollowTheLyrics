[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "followthelyrics"
description = "Les paroles de ta musique, par-dessus tes jeux."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "PyQt6==6.7.1",
    "PyQt6-Qt6==6.7.3",
    "numpy>=1.26",
    "winrt-runtime; sys_platform == 'win32'",
    "winrt-Windows.Media.Control; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
    "PyAudioWPatch; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4",
    "pytest>=9.0",
    "ruff>=0.17",
]
build = ["pyinstaller>=6.11"]

[project.gui-scripts]
followthelyrics = "followthelyrics.__main__:main"

[tool.setuptools.dynamic]
version = { file = "src/followthelyrics/VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
followthelyrics = ["VERSION"]

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PIE",
    "PERF", "BLE", "LOG", "G", "PL", "RUF", "TID",
]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "PLW0603",
    "RET504", "RET505",
    "SIM108",
    "PLR0917",
]
allowed-confusables = ["−", "–", "："]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["followthelyrics"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
    "*Event", "eventFilter", "sizeHint", "minimumSizeHint", "nativeEvent",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"src/followthelyrics/__main__.py" = ["PLC0415"]
"src/followthelyrics/desktop/windows/api.py" = ["N801", "N815"]

[tool.mypy]
python_version = "3.12"
platform = "win32"
mypy_path = "src"
packages = ["followthelyrics"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
pythonpath = ["src"]
